<!-- blog/templates/blog/base.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bob's Wonderland{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- 自定义样式 -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<bofdy class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">
                <i class="bi bi-flower1"></i> BOB'S WONDERLAND
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">主页</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">分类</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{% url 'category' 'life' %}">生活</a></li>
                            <li><a class="dropdown-item" href="{% url 'category' 'learning' %}">学习</a></li>
                            <li><a class="dropdown-item" href="{% url 'category' 'travel' %}">旅游</a></li>
                            <li><a class="dropdown-item" href="{% url 'category' 'reflection' %}">感悟</a></li>
                        </ul>
                    </li>
                    <!-- 搜索框 -->
                    <li class="nav-item ms-2">
                        <form class="d-flex" action="{% url 'search' %}" method="get">
                            <input class="form-control me-1" type="search" name="q" placeholder="搜索文章..." aria-label="Search">
                            <button class="btn btn-outline-success" type="submit"><i class="bi bi-search"></i></button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-top py-4 mt-5">
        <div class="container text-center text-muted">
            <small>© Bob's Wonderland · 探索生活，记录故事</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</bofdy>
</html>
